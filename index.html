<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>Chatter — WhatsApp-style Chat</title>
<style>
  :root{
    --bg-app:#0b141a;
    --bg-sidebar:#111b21;
    --bg-header:#202c33;
    --bg-chat:#0b141a;
    --bg-input:#2a3942;
    --bubble-in:#202c33;
    --bubble-out:#005c4b;
    --text:#e9edef;
    --text-dim:#8696a0;
    --text-mute:#667781;
    --border:#222d34;
    --hover:#202c33;
    --active:#2a3942;
    --accent:#00a884;
    --tick:#8696a0;
    --tick-read:#53bdeb;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  html[data-theme="light"]{
    --bg-app:#f0f2f5;
    --bg-sidebar:#ffffff;
    --bg-header:#f0f2f5;
    --bg-chat:#efeae2;
    --bg-input:#ffffff;
    --bubble-in:#ffffff;
    --bubble-out:#d9fdd3;
    --text:#111b21;
    --text-dim:#667781;
    --text-mute:#8696a0;
    --border:#e9edef;
    --hover:#f5f6f6;
    --active:#f0f2f5;
    --accent:#00a884;
    --tick:#8696a0;
    --tick-read:#53bdeb;
    --shadow:0 10px 30px rgba(11,20,26,.15);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background:#0a0f14;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  html[data-theme="light"] body{ background:#d1d7db; }

  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  input, textarea{ font-family:inherit; }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:rgba(134,150,160,.35); border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover{ background:rgba(134,150,160,.6); }
  ::-webkit-scrollbar-track{ background:transparent; }

  /* =========================================================
     APP SHELL
     ========================================================= */
  .app{
    display:flex;
    height:100vh;
    height:100dvh;
    max-width:1600px;
    margin:0 auto;
    background:var(--bg-app);
    overflow:hidden;
  }

  /* =========================================================
     SIDEBAR
     ========================================================= */
  .sidebar{
    width:400px;
    flex:0 0 400px;
    display:flex;
    flex-direction:column;
    min-height:0;
    background:var(--bg-sidebar);
    border-right:1px solid var(--border);
  }

  .sidebar-header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 16px;
    height:60px;
    flex:0 0 60px;
    background:var(--bg-header);
    border-bottom:1px solid var(--border);
  }
  .me-avatar{
    width:40px; height:40px;
    border-radius:50%;
    display:grid; place-items:center;
    font-size:20px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    flex:0 0 auto;
  }
  .sidebar-title{
    flex:1;
    font-size:16px;
    font-weight:700;
    letter-spacing:-.01em;
  }
  .icon-btn{
    width:40px; height:40px;
    display:grid; place-items:center;
    border-radius:50%;
    color:var(--text-dim);
    transition:background .15s, color .15s;
  }
  .icon-btn:hover{ background:rgba(134,150,160,.15); color:var(--text); }
  .icon-btn svg{ width:20px; height:20px; }

  .search-wrap{
    padding:8px 12px;
    background:var(--bg-sidebar);
    border-bottom:1px solid var(--border);
  }
  .search{
    display:flex;
    align-items:center;
    gap:10px;
    height:38px;
    padding:0 12px;
    border-radius:10px;
    background:var(--bg-input);
  }
  html[data-theme="light"] .search{ background:#f0f2f5; }
  .search svg{ width:17px; height:17px; color:var(--text-dim); flex:0 0 auto; }
  .search input{
    flex:1;
    border:none;
    background:transparent;
    outline:none;
    color:var(--text);
    font-size:14px;
  }
  .search input::placeholder{ color:var(--text-mute); }

  .chat-list{
    list-style:none;
    margin:0;
    padding:0;
    flex:1;
    min-height:0;
    overflow-y:auto;
    overscroll-behavior:contain;
  }
  .chat-item{
    display:flex;
    gap:13px;
    padding:11px 16px;
    cursor:pointer;
    transition:background .12s;
    border-bottom:1px solid transparent;
  }
  .chat-item:hover{ background:var(--hover); }
  .chat-item.active{ background:var(--active); }

  .avatar{
    width:49px; height:49px;
    flex:0 0 49px;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:22px;
    color:#fff;
    user-select:none;
  }

  .chat-info{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:3px;
  }
  .chat-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
  }
  .chat-name{
    font-size:15.5px;
    font-weight:500;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .chat-time{
    font-size:12px;
    color:var(--text-dim);
    flex:0 0 auto;
  }
  .chat-item.has-unread .chat-time{ color:var(--accent); font-weight:600; }

  .chat-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .chat-preview{
    font-size:13.5px;
    color:var(--text-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1;
    min-width:0;
  }
  .chat-preview.typing{ color:var(--accent); font-style:italic; }

  .badge{
    flex:0 0 auto;
    min-width:20px;
    height:20px;
    padding:0 6px;
    border-radius:10px;
    background:var(--accent);
    color:#04120e;
    font-size:11.5px;
    font-weight:700;
    display:grid;
    place-items:center;
  }

  /* =========================================================
     CHAT PANEL
     ========================================================= */
  .chat{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    min-height:0;
    background:var(--bg-chat);
    position:relative;
  }

  .chat-header{
    display:flex;
    align-items:center;
    gap:12px;
    height:60px;
    flex:0 0 60px;
    padding:0 16px;
    background:var(--bg-header);
    border-bottom:1px solid var(--border);
    z-index:5;
  }
  .back-btn{ display:none; }
  .chat-header .avatar{ width:40px; height:40px; flex-basis:40px; font-size:19px; }
  .chat-header-info{ flex:1; min-width:0; }
  .chat-header-name{
    font-size:15.5px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .chat-header-status{
    font-size:12.5px;
    color:var(--text-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .chat-header-status.online{ color:var(--accent); }

  .ai-tag{
    display:inline-block;
    padding:1px 6px;
    margin-left:6px;
    border-radius:4px;
    font-size:10px;
    font-weight:800;
    letter-spacing:.5px;
    background:var(--accent);
    color:#04120e;
    vertical-align:middle;
    line-height:1.5;
  }

  .messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    overscroll-behavior:contain;
    padding:18px 6% 12px;
    display:flex;
    flex-direction:column;
    gap:3px;
    background-color:var(--bg-chat);
    background-image:
      radial-gradient(circle at 20px 20px, rgba(134,150,160,.06) 1.5px, transparent 1.6px),
      radial-gradient(circle at 60px 70px, rgba(134,150,160,.05) 1.5px, transparent 1.6px);
    background-size:100px 100px, 140px 140px;
  }
  html[data-theme="light"] .messages{
    background-image:
      radial-gradient(circle at 20px 20px, rgba(120,100,80,.09) 1.5px, transparent 1.6px),
      radial-gradient(circle at 60px 70px, rgba(120,100,80,.07) 1.5px, transparent 1.6px);
    background-size:100px 100px, 140px 140px;
  }

  .date-pill{
    align-self:center;
    margin:10px 0 14px;
    padding:6px 12px;
    border-radius:8px;
    background:var(--bg-header);
    color:var(--text-dim);
    font-size:12px;
    font-weight:600;
    letter-spacing:.04em;
    box-shadow:0 1px 1px rgba(0,0,0,.12);
    text-transform:uppercase;
  }
  html[data-theme="light"] .date-pill{ background:#fff; color:#54656f; }

  /* bubble: grid so the meta can sit bottom-right reliably */
  .msg{
    position:relative;
    max-width:min(72%, 560px);
    padding:6px 9px 7px 9px;
    border-radius:8px;
    font-size:14.6px;
    line-height:1.4;
    word-wrap:break-word;
    overflow-wrap:anywhere;
    box-shadow:0 1px 1px rgba(0,0,0,.13);
    animation:pop .18s ease-out both;
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    column-gap:8px;
    align-items:end;
  }
  @keyframes pop{
    from{ opacity:0; transform:translateY(6px) scale(.98); }
    to  { opacity:1; transform:none; }
  }

  .msg.in{
    align-self:flex-start;
    background:var(--bubble-in);
    margin-right:auto;
  }
  .msg.in.first{ border-top-left-radius:2px; }

  .msg.out{
    align-self:flex-end;
    background:var(--bubble-out);
    margin-left:auto;
  }
  .msg.out.first{ border-top-right-radius:2px; }

  .msg-text{
    grid-column:1;
    grid-row:1;
    white-space:pre-wrap;
    min-width:0;
  }
  .msg-text strong{ font-weight:700; }
  .msg-text code{
    padding:1px 5px;
    border-radius:4px;
    background:rgba(134,150,160,.22);
    font-family:'SF Mono', Consolas, Menlo, monospace;
    font-size:.88em;
  }

  .msg-meta{
    grid-column:2;
    grid-row:1;
    align-self:end;
    white-space:nowrap;
    font-size:11px;
    color:var(--text-dim);
    user-select:none;
    display:inline-flex;
    align-items:center;
    gap:3px;
  }
  html[data-theme="light"] .msg.out .msg-meta{ color:#667781; }

  .tick{ display:inline-flex; align-items:center; }
  .tick svg{ width:16px; height:11px; display:block; color:var(--tick); }
  .tick.read svg{ color:var(--tick-read); }

  .typing-bubble{
    align-self:flex-start;
    background:var(--bubble-in);
    border-radius:8px;
    border-top-left-radius:2px;
    padding:12px 14px;
    display:flex;
    gap:4px;
    box-shadow:0 1px 1px rgba(0,0,0,.13);
    animation:pop .18s ease-out both;
  }
  .typing-bubble span{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--text-dim);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing-bubble span:nth-child(2){ animation-delay:.15s; }
  .typing-bubble span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{
    0%, 60%, 100%{ transform:translateY(0); opacity:.5; }
    30%{ transform:translateY(-5px); opacity:1; }
  }

  /* =========================================================
     COMPOSER
     ========================================================= */
  .composer{
    position:relative;
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:10px 16px;
    padding-bottom:max(10px, env(safe-area-inset-bottom));
    background:var(--bg-header);
    border-top:1px solid var(--border);
    flex:0 0 auto;
  }
  .input-pill{
    flex:1;
    display:flex;
    align-items:flex-end;
    min-height:44px;
    padding:9px 14px;
    border-radius:22px;
    background:var(--bg-input);
  }
  html[data-theme="light"] .input-pill{ background:#fff; }
  .input-pill textarea{
    flex:1;
    border:none;
    outline:none;
    resize:none;
    background:transparent;
    color:var(--text);
    font-size:15px;
    line-height:1.35;
    max-height:120px;
    padding:2px 0;
  }
  .input-pill textarea::placeholder{ color:var(--text-mute); }

  .send-btn{
    width:46px; height:46px;
    flex:0 0 46px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:var(--accent);
    color:#04120e;
    transition:transform .12s ease, opacity .2s ease;
  }
  .send-btn:hover{ transform:scale(1.05); }
  .send-btn:active{ transform:scale(.94); }
  .send-btn svg{ width:22px; height:22px; }

  .emoji-picker{
    position:absolute;
    left:12px;
    bottom:calc(100% + 10px);
    width:min(320px, calc(100vw - 32px));
    padding:10px;
    border-radius:14px;
    background:var(--bg-header);
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    display:grid;
    grid-template-columns:repeat(8, 1fr);
    gap:2px;
    transform:scale(.92) translateY(8px);
    transform-origin:bottom left;
    opacity:0;
    pointer-events:none;
    transition:transform .16s ease, opacity .16s ease;
    z-index:20;
  }
  .emoji-picker.open{
    transform:scale(1) translateY(0);
    opacity:1;
    pointer-events:auto;
  }
  .emoji-picker button{
    font-size:21px;
    aspect-ratio:1;
    border-radius:8px;
    display:grid;
    place-items:center;
    transition:background .12s, transform .12s;
  }
  .emoji-picker button:hover{ background:rgba(134,150,160,.2); transform:scale(1.15); }

  /* =========================================================
     RESPONSIVE
     ========================================================= */
  @media (max-width: 860px){
    .sidebar{ width:100%; flex-basis:100%; border-right:none; }
    .chat{ display:none; }
    .app.chat-open .sidebar{ display:none; }
    .app.chat-open .chat{ display:flex; }
    .back-btn{ display:grid; }
    .messages{ padding:14px 10px 10px; }
    .msg{ max-width:86%; }
    .composer{ padding-left:10px; padding-right:10px; }
  }

  @media (max-width: 380px){
    .avatar{ width:44px; height:44px; flex-basis:44px; font-size:20px; }
    .chat-item{ padding:10px 12px; gap:10px; }
    .chat-name{ font-size:15px; }
  }

  .icon-btn:focus-visible,
  .send-btn:focus-visible,
  .chat-item:focus-visible,
  .emoji-picker button:focus-visible,
  .search input:focus-visible,
  .input-pill textarea:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="app" id="app">

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="me-avatar">🐼</div>
      <div class="sidebar-title">Beltah CHAT INTERFACE</div>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">
        <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg id="iconSun" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </button>
      <button class="icon-btn" aria-label="New chat" title="New chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </div>

    <div class="search-wrap">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
        <input id="searchInput" type="search" placeholder="Search or start new chat"
               aria-label="Search chats" />
      </label>
    </div>

    <ul class="chat-list" id="chatList" role="listbox" aria-label="Chats"></ul>
  </aside>

  <!-- ================= CHAT PANEL ================= -->
  <main class="chat" id="chatPanel">
    <header class="chat-header">
      <button class="icon-btn back-btn" id="backBtn" aria-label="Back to chats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <div class="avatar" id="headerAvatar">🤖</div>
      <div class="chat-header-info">
        <div class="chat-header-name" id="headerName">Select a chat</div>
        <div class="chat-header-status" id="headerStatus">—</div>
      </div>
      <button class="icon-btn" aria-label="Video call" title="Video call">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="m22 8-6 4 6 4V8Z"/>
          <rect x="2" y="6" width="14" height="12" rx="2"/>
        </svg>
      </button>
      <button class="icon-btn" aria-label="More options" title="More">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
        </svg>
      </button>
    </header>

    <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Messages"></div>

    <footer class="composer">
      <div class="emoji-picker" id="emojiPicker" role="dialog" aria-label="Emoji picker"></div>

      <button class="icon-btn" id="emojiBtn" aria-label="Insert emoji" title="Emoji">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/>
          <line x1="9" y1="9.5" x2="9.01" y2="9.5"/>
          <line x1="15" y1="9.5" x2="15.01" y2="9.5"/>
        </svg>
      </button>

      <div class="input-pill">
        <textarea id="input" rows="1" placeholder="Type a message"
                  enterkeyhint="send" aria-label="Message"></textarea>
      </div>

      <button class="send-btn" id="sendBtn" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M3.4 20.4 21.2 12 3.4 3.6 3.4 10l12 2-12 2z"/>
        </svg>
      </button>
    </footer>
  </main>
</div>

    ]
  },
  {
    id: 'c5',
    name: 'Remote & Dev Network',
    avatar: '💻',
    avatarBg: 'linear-gradient(135deg,#0ea5e9,#0284c7)',
    status: '12 members',
    online: false,
    unread: 0,
    typing: false,
    messages: [
      { id:'m1', from:'them', text:'Evening moderation and AI training tasks are live for 7 PM EAT ⚡', time:'Yesterday', status:'read' },
      { id:'m2', from:'me',   text:'Desktop setup and backup power are ready. Logging in now!', time:'Yesterday', status:'read' },
      { id:'m3', from:'them', text:'Great, see you in the queue.', time:'Yesterday', status:'read' }
    ]

    name: 'Beltah WhatsApp Bot',

    online: true,

const AUTO_REPLIES = [
  "📲 STK Push initiated! Check your handset to enter your M-Pesa PIN.",
  "✅ Payment received! Your session is now active.",
  "Haha, that's great! 😄",
  "Sure thing — I'll get back to you shortly.",
  "Got it 👍",
  "Let me check from my workstation and confirm.",
  "On it! Pushing the update to GitHub now 🚀",
  "Perfect, thanks!"
];

  /* =========================================================
     2. REFS
     ========================================================= */
  const app          = document.getElementById('app');
  const chatListEl   = document.getElementById('chatList');
  const messagesEl   = document.getElementById('messages');
  const inputEl      = document.getElementById('input');
  const sendBtn      = document.getElementById('sendBtn');
  const emojiBtn     = document.getElementById('emojiBtn');
  const emojiPicker  = document.getElementById('emojiPicker');
  const searchInput  = document.getElementById('searchInput');
  const backBtn      = document.getElementById('backBtn');
  const themeBtn     = document.getElementById('themeBtn');
  const iconMoon     = document.getElementById('iconMoon');
  const iconSun      = document.getElementById('iconSun');
  const headerAvatar = document.getElementById('headerAvatar');
  const headerName   = document.getElementById('headerName');
  const headerStatus = document.getElementById('headerStatus');

  let activeId = null;
  const typingTimers = {};
  const replyTimers  = {};

  /* =========================================================
     3. HELPERS
     ========================================================= */
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // tiny markdown: **bold** and `code`
  function mdLite(text) {
    let html = escapeHtml(text).replace(/\n+$/, '');
    html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    return html;
  }

  function nowTime() {
    const d = new Date();
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  function getChat(id) {
    return chats.find(function (c) { return c.id === id; });
  }

  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function tickHTML(status) {
    if (status === 'sent') {
      return '<span class="tick"><svg viewBox="0 0 16 11"><path d="M1 6l4 4L15 1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
    }
    const readCls = status === 'read' ? ' read' : '';
    return '<span class="tick' + readCls + '"><svg viewBox="0 0 20 11">' +
      '<path d="M1 6l4 4L15 1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="M6 6l4 4L20 1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg></span>';
  }

  function scrollToBottom(smooth) {
    requestAnimationFrame(function () {
      messagesEl.scrollTo({
        top: messagesEl.scrollHeight,
        behavior: smooth ? 'smooth' : 'auto'
      });
    });
  }

  /* =========================================================
     4. RENDER — CHAT LIST
     ========================================================= */
  function renderChatList() {
    const query = searchInput.value.trim().toLowerCase();

    const visible = chats.filter(function (c) {
      if (!query) return true;
      const last = c.messages[c.messages.length - 1];
      const preview = last ? last.text : '';
      return (c.name + ' ' + preview).toLowerCase().includes(query);
    });

    chatListEl.innerHTML = visible.map(function (c) {
      const last = c.messages[c.messages.length - 1];
      let preview = '';
      if (c.typing) {
        preview = 'typing…';
      } else if (last) {
        // strip markdown-ish chars for the preview
        const raw = last.text.replace(/\*\*([^*]+)\*\*/g, '$1').replace(/`([^`]+)`/g, '$1').replace(/\n/g, ' ');
        preview = (last.from === 'me' ? 'You: ' : '') + raw;
      }

      const time = last ? last.time : '';
      const unread = c.unread > 0;

      return '' +
        '<li class="chat-item' +
          (c.id === activeId ? ' active' : '') +
          (unread ? ' has-unread' : '') +
        '" data-id="' + c.id + '" tabindex="0" role="option"' +
        ' aria-selected="' + (c.id === activeId) + '">' +
          '<div class="avatar" style="background:' + c.avatarBg + '">' + c.avatar + '</div>' +
          '<div class="chat-info">' +
            '<div class="chat-top">' +
              '<span class="chat-name">' + escapeHtml(c.name) + '</span>' +
              '<span class="chat-time">' + escapeHtml(time) + '</span>' +
            '</div>' +
            '<div class="chat-bottom">' +
              '<span class="chat-preview' + (c.typing ? ' typing' : '') + '">' +
                escapeHtml(preview) +
              '</span>' +
              (unread ? '<span class="badge">' + c.unread + '</span>' : '') +
            '</div>' +
          '</div>' +
        '</li>';
    }).join('');

    if (!visible.length) {
      chatListEl.innerHTML =
        '<li style="padding:32px 20px;text-align:center;color:var(--text-dim);font-size:14px">' +
        'No chats found</li>';
    }
  }

  /* =========================================================
     5. RENDER — MESSAGES
     ========================================================= */
  function renderMessages(chat, smooth) {
    if (!chat) {
      messagesEl.innerHTML = '';
      return;
    }

    const parts = ['<div class="date-pill">Today</div>'];

    chat.messages.forEach(function (m, i) {
      const prev = chat.messages[i - 1];
      const isFirst = !prev || prev.from !== m.from;
      const dir = m.from === 'me' ? 'out' : 'in';
      const rendered = chat.isAI ? mdLite(m.text) : escapeHtml(m.text);

      parts.push(
        '<div class="msg ' + dir + (isFirst ? ' first' : '') + '" data-id="' + m.id + '">' +
          '<span class="msg-text">' + rendered + '</span>' +
          '<span class="msg-meta">' +
            '<span class="msg-time">' + escapeHtml(m.time) + '</span>' +
            (m.from === 'me' ? tickHTML(m.status) : '') +
          '</span>' +
        '</div>'
      );
    });

    if (chat.typing) {
      parts.push(
        '<div class="typing-bubble" aria-label="Typing">' +
          '<span></span><span></span><span></span>' +
        '</div>'
      );
    }

    messagesEl.innerHTML = parts.join('');
    scrollToBottom(smooth);
  }

  /* =========================================================
     6. OPEN CHAT
     ========================================================= */
  function openChat(id) {
    const chat = getChat(id);
    if (!chat) return;

    activeId = id;
    chat.unread = 0;

    headerAvatar.textContent = chat.avatar;
    headerAvatar.style.background = chat.avatarBg;

    if (chat.isAI) {
      headerName.innerHTML = escapeHtml(chat.name) + ' <span class="ai-tag">AI</span>';
    } else {
      headerName.textContent = chat.name;
    }

    headerStatus.textContent = chat.status;
    headerStatus.classList.toggle('online', !!chat.online);

    app.classList.add('chat-open');

    renderChatList();
    renderMessages(chat, false);
    inputEl.focus({ preventScroll: true });
  }

  function closeChat() {
    app.classList.remove('chat-open');
  }

  /* =========================================================
     7. SEND MESSAGE
     ========================================================= */
  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || !activeId) return;

    const chat = getChat(activeId);
    const msg = {
      id: 'm' + Date.now() + Math.random().toString(36).slice(2, 6),
      from: 'me',
      text: text,
      time: nowTime(),
      status: 'sent'
    };
    chat.messages.push(msg);

    inputEl.value = '';
    autoResize();

    renderMessages(chat, true);
    renderChatList();

    setTimeout(function () {
      const m = chat.messages.find(function (x) { return x.id === msg.id; });
      if (m && m.status === 'sent') {
        m.status = 'delivered';
        if (activeId === chat.id) renderMessages(chat, false);
      }
    }, 900);

    setTimeout(function () {
      const m = chat.messages.find(function (x) { return x.id === msg.id; });
      if (m && m.status !== 'read') {
        m.status = 'read';
        if (activeId === chat.id) renderMessages(chat, false);
      }
    }, 2200);

    scheduleReply(chat);
  }

  /* =========================================================
     8. AUTO REPLY (with typing indicator)
     ========================================================= */
  function scheduleReply(chat) {
    clearTimeout(typingTimers[chat.id]);
    clearTimeout(replyTimers[chat.id]);

    const isAI = !!chat.isAI;
    const typingDelay = isAI ? 400 : 700;
    const replyDelay  = isAI
      ? (1000 + Math.random() * 1100)
      : (1600 + Math.random() * 1400);

    typingTimers[chat.id] = setTimeout(function () {
      if (chat.typing) return;
      chat.typing = true;
      renderChatList();
      if (activeId === chat.id) renderMessages(chat, true);
    }, typingDelay);

    replyTimers[chat.id] = setTimeout(function () {
      chat.typing = false;

      let reply;
      if (isAI) {
        const lastUser = chat.messages.filter(function (m) { return m.from === 'me'; }).slice(-1)[0];
        reply = getAIReply(lastUser ? lastUser.text : '');
      } else {
        reply = pick(AUTO_REPLIES);
      }

      chat.messages.push({
        id: 'm' + Date.now() + Math.random().toString(36).slice(2, 6),
        from: 'them',
        text: reply,
        time: nowTime(),
        status: 'read'
      });

      if (activeId === chat.id) {
        renderMessages(chat, true);
      } else {
        chat.unread = (chat.unread || 0) + 1;
      }
      renderChatList();
    }, replyDelay);
  }

  /* =========================================================
     9. AI BRAIN (pattern-matched Claude replies)
     ========================================================= */
  function getAIReply(text) {
    const t = text.toLowerCase().trim();

    // About me
    if (/\b(who are you|what are you|your name|about (you|yourself)|introduce yourself|are you (claude|ai|human|real|gpt))\b/.test(t)) {
      return "I'm **Claude**, an AI assistant made by Anthropic. 🤖\n\nIn this demo though, I'm just a simulation — my replies here are picked from a script, not generated live. The real me can reason through problems, write and review code, analyze documents, and hold much longer conversations.\n\nIf you want to meet the real deal, head to **claude.ai**. 😊";
    }

    // Greeting
    if (/^(hi|hello|hey|yo|sup|howdy|hola|greetings|hiya|heya)\b/.test(t)) {
      return pick([
        "Hey! 👋 Great to see you. What's on your mind?",
        "Hello! 😄 How can I help?",
        "Hi there! Ready when you are — what would you like to talk about?"
      ]);
    }

    // How are you
    if (/\b(how are you|how's it going|how do you feel|hru|how r u|what's up|whats up|wassup)\b/.test(t)) {
      return "Running smoothly, thanks for asking! 😄\n\nWhat about you — how's your day going?";
    }

    // Thanks
    if (/\b(thanks|thank you|thx|ty|appreciate it|cheers)\b/.test(t)) {
      return "You're very welcome! 😊 Anything else I can help with?";
    }

    // Bye
    if (/\b(bye|goodbye|see you|see ya|later|good night|goodnight|cya|gotta go)\b/.test(t)) {
      return "Take care! 👋 Come back and chat anytime.";
    }

    // Help / capabilities
    if (/\b(help|what can you do|capabilities|features|commands|what do you do)\b/.test(t)) {
      return "Happy to help! 🌟\n\nSince this is a demo, my replies are pattern-matched. But you can try:\n• **hi** — say hello\n• **who are you?** — learn about me\n• **code** — ask about coding\n• **design** — ask about UI/UX\n• Or just type freely and I'll respond 😄";
    }

    // Code
    if (/\b(code|coding|javascript|js|css|html|react|vue|python|programming|developer|bug|function|algorithm)\b/.test(t)) {
      return "Oh, coding — my favorite topic! 🧑‍💻\n\nFor this demo I can't actually read or run code, but the real me is quite good at it. In a real chat I'd:\n• Walk through the logic step by step\n• Point out bugs and edge cases\n• Suggest cleaner alternatives\n\nWhat are you working on?";
    }

    // Design
    if (/\b(design|ui|ux|color|layout|responsive|font|typography|animation|style)\b/.test(t)) {
      return "Design questions are fun! 🎨\n\nA few things I keep in mind:\n• **Hierarchy first** — what's the ONE thing users should see first?\n• **Whitespace is a feature**, not wasted space\n• **Test at 320px** before trusting it on desktop\n• **Respect prefers-reduced-motion** for accessibility\n\nWhat are you designing?";
    }

    // About this page
    if (/\b(this (page|site|app|chat|interface|demo)|how does (this|it) work)\b/.test(t)) {
      return "This is a WhatsApp-style chat UI built with vanilla HTML, CSS, and JavaScript. 🛠️\n\nHighlights:\n• Message bubbles with delivery ticks\n• Typing indicator with bouncing dots\n• Emoji picker + auto-resize textarea\n• Dark/light theme toggle\n• Responsive — sidebar collapses on mobile\n\nAnd of course, the AI chat you're in right now is simulated with pattern matching. 😄";
    }

    // Question mark fallback
    if (t.includes('?')) {
      return pick([
        "Good question! 🤔\n\nHonest answer: this demo runs entirely on local JavaScript, so I can't truly reason about that. But if you ask the real me at **claude.ai**, I can dig much deeper.\n\nWhat made you curious?",
        "Hmm, that's a thoughtful one. 🧠\n\nI'm just a canned-reply bot here, so I can't actually explore it — but I'd love to hear what you're thinking. What sparked the question?",
        "Interesting! 🤔 Since I'm a simulation, I can't give you a real answer to that — but the real Claude could. Want to share more context?"
      ]);
    }

    // Default
    return pick([
      "Got it! 🙂 I'm a simulated version of Claude, so my replies here are a bit limited — but I'm glad you're trying the demo!",
      "Nice. 😄 Anything specific you'd like to explore in this chat?",
      "Noted! What else is on your mind?",
      "I hear you. What would you like to talk about next?",
      "Thanks for sharing that! Feel free to try asking me about **code**, **design**, or **who I am**. 😊",
      "Hmm, interesting. Tell me more?"
    ]);
  }

  /* =========================================================
     10. COMPOSER
     ========================================================= */
  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  }

  inputEl.addEventListener('input', autoResize);

  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  /* =========================================================
     11. EMOJI PICKER
     ========================================================= */
  emojiPicker.innerHTML = EMOJIS.map(function (e) {
    return '<button type="button" aria-label="' + e + '">' + e + '</button>';
  }).join('');

  emojiBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    emojiPicker.classList.toggle('open');
  });

  emojiPicker.addEventListener('click', function (e) {
    const btn = e.target.closest('button');
    if (!btn) return;

    const emoji = btn.textContent;
    const start = inputEl.selectionStart;
    const end = inputEl.selectionEnd;
    const val = inputEl.value;

    inputEl.value = val.slice(0, start) + emoji + val.slice(end);
    inputEl.selectionStart = inputEl.selectionEnd = start + emoji.length;
    inputEl.focus();
    autoResize();
  });

  document.addEventListener('click', function (e) {
    if (!emojiPicker.contains(e.target) && e.target !== emojiBtn) {
      emojiPicker.classList.remove('open');
    }
  });

  /* =========================================================
     12. CHAT LIST EVENTS
     ========================================================= */
  chatListEl.addEventListener('click', function (e) {
    const item = e.target.closest('.chat-item');
    if (item) openChat(item.dataset.id);
  });

  chatListEl.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const item = e.target.closest('.chat-item');
    if (item) {
      e.preventDefault();
      openChat(item.dataset.id);
    }
  });

  backBtn.addEventListener('click', closeChat);
  searchInput.addEventListener('input', renderChatList);

  /* =========================================================
     13. THEME TOGGLE
     ========================================================= */
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    const light = theme === 'light';
    iconMoon.hidden = light;
    iconSun.hidden = !light;
    try { localStorage.setItem('chatter-theme', theme); } catch (_) {}
  }

  (function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem('chatter-theme'); } catch (_) {}
    if (saved === 'light' || saved === 'dark') {
      applyTheme(saved);
    } else {
      const prefersLight = window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: light)').matches;
      applyTheme(prefersLight ? 'light' : 'dark');
    }
  })();

  themeBtn.addEventListener('click', function () {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });

  /* =========================================================
     14. INIT
     ========================================================= */
  renderChatList();

  if (window.innerWidth > 860) {
    openChat(chats[0].id); // opens the AI chat
    app.classList.remove('chat-open');
  } else {
    const first = getChat(chats[0].id);
    headerAvatar.textContent = first.avatar;
    headerAvatar.style.background = first.avatarBg;
    headerName.innerHTML = escapeHtml(first.name) + ' <span class="ai-tag">AI</span>';
    headerStatus.textContent = first.status;
  }

  autoResize();
})();
</script>
